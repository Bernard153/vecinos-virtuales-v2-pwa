<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a40">
    <title>🛡️ Ruta Segura</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a40 0%, #2d2d6e 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }
        #shield {
            font-size: 5rem;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.9; }
        }
        h1 {
            font-size: 1.4rem;
            margin: 1rem 0 0.5rem;
            font-weight: 700;
        }
        #message {
            font-size: 0.9rem;
            opacity: 0.8;
            text-align: center;
            max-width: 80%;
            line-height: 1.5;
        }
        #timer {
            font-size: 1.2rem;
            margin-top: 1.5rem;
            font-weight: 600;
            opacity: 0.9;
        }
        #status {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            opacity: 0.6;
        }
        #error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            max-width: 85%;
            display: none;
        }
        #error h2 { font-size: 1.1rem; margin-bottom: 0.5rem; }
        #error p { font-size: 0.85rem; opacity: 0.8; }
        .loading {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #FFB627;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #alerta-gracia {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(239, 68, 68, 0.9);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: flash 0.5s ease-in-out infinite;
        }
        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        #alerta-gracia h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        #alerta-gracia p {
            font-size: 1rem;
            opacity: 0.9;
        }
        #alerta-gracia button {
            margin-top: 2rem;
            padding: 1rem 3rem;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            background: white;
            color: #dc2626;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="loading"></div>
        <p style="margin-top:1rem;font-size:0.85rem;opacity:0.6;">Iniciando ruta segura...</p>
    </div>

    <div id="error">
        <h2>⚠️ Ruta no disponible</h2>
        <p id="error-msg">El enlace no es válido o la ruta ya no está activa.</p>
    </div>

    <div id="ruta-activa" style="display:none;">
        <div id="shield">🛡️</div>
        <h1>Ruta segura activa</h1>
        <p id="message">Tu papá te está cuidando 🌟</p>
        <div id="timer"></div>
        <div id="status">📍 Compartiendo ubicación...</div>
    </div>

    <div id="alerta-gracia">
        <h2>⏰ ¿Llegaste a destino?</h2>
        <p>Si ya llegaste, tocá el botón</p>
        <button id="btn-llegue">✅ Sí, ya llegué</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/ruta-segura.js"></script>
</body>
</html>
